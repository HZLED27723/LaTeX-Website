name: LaTeX library site

# Validates every library entry, renders all previews, builds the
# static site and deploys it to GitHub Pages. Because previews are rendered
# here, you can add an entry by committing just its .tex + .meta.json (even
# from the GitHub web editor).
#
# One-time setup (already done): Settings -> Pages -> Source: "GitHub Actions".
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: latex-library-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install TeX Live + preview tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended texlive-science \
            cm-super latexmk ghostscript poppler-utils
      - name: Validate entries (metadata + compile)
        run: python3 tools/validate.py --strict
      - name: Render previews and build the site
        run: python3 tools/build_site.py --render all
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
